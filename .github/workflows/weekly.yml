name: weekly-judge

# 定期実行は Claude のスケジュールタスク（毎週土曜 08:44 JST）で行っているため、
# この workflow は手動起動のみ。GitHub Actions で定期実行したい場合は schedule を有効にする。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 0 * * 6"   # 毎週土曜 09:00 JST（GitHub の cron は UTC）

permissions:
  contents: write

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e .
      - name: judge
        env:
          KABU_WEBHOOK_URL: ${{ secrets.KABU_WEBHOOK_URL }}
          KABU_SMTP_HOST: ${{ secrets.KABU_SMTP_HOST }}
          KABU_SMTP_PORT: ${{ secrets.KABU_SMTP_PORT }}
          KABU_SMTP_USER: ${{ secrets.KABU_SMTP_USER }}
          KABU_SMTP_PASSWORD: ${{ secrets.KABU_SMTP_PASSWORD }}
          KABU_MAIL_TO: ${{ secrets.KABU_MAIL_TO }}
        run: .venv/bin/kabu judge --notify
      - name: commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/latest.md
          git diff --cached --quiet || git commit -m "chore: weekly report $(date -u +%F)"
          git push
