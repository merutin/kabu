[project]
name = "kabu"
version = "0.1.0"
description = "日本株（最大5銘柄）の配当・優待・株価を合わせたトータルリターンで売買判断を支援するツール"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "yfinance>=0.2.40",
    "jpholiday>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kabu = "kabu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kabu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
